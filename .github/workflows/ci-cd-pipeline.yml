name: Full Test Matrix & Docker Publish

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      pit_debug:
        description: 'Run PIT mutation testing in verbose debug mode'
        required: false
        default: 'false'
  schedule:
    # Run stress tests weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: backend

jobs:
  # #412: see the identical job in ci.yml for rationale — always-triggering
  # workflow + job-level conditional on this output, instead of a workflow-level
  # paths-ignore that made the required checks below never report a status.
  detect-changes:
    name: Detect Doc-Only Change
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # predicate-quantifier: every is required -- see identical comment in ci.yml.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'

  # Job 1: Unit Tests (Fast Feedback)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Grant execute permissions to mvnw
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: chmod +x ./mvnw

      - name: Run unit tests
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: ./mvnw test -P unit-tests

      - name: Upload test results
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/target/surefire-reports/

  # Job 2: Integration Tests with Coverage
  integration-tests:
    name: Integration Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ unit-tests, detect-changes ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Grant execute permissions to mvnw
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: chmod +x ./mvnw

      - name: Run integration tests with coverage
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: ./mvnw verify -P ci -Dpitest.skip=${{ github.event_name == 'workflow_dispatch' && inputs.pit_debug == 'true' }}

      - name: Parse PIT Mutation Report
        id: pit
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          from collections import defaultdict
          from pathlib import Path

          report_file = Path("target/pit-reports/mutations.xml")
          result = {"present": report_file.exists()}

          if result["present"]:
              tree = ET.parse(report_file)
              mutations = tree.getroot().findall("mutation")

              killed = survived = no_coverage = 0
              survived_by_class = defaultdict(int)

              for m in mutations:
                  detected = m.get("detected") == "true"
                  status = m.findtext("status", default="")
                  if status == "NO_COVERAGE":
                      no_coverage += 1
                      survived_by_class[m.findtext("mutatedClass", default="?")] += 1
                  elif detected:
                      killed += 1
                  else:
                      survived += 1
                      survived_by_class[m.findtext("mutatedClass", default="?")] += 1

              total = killed + survived + no_coverage
              reached = killed + survived

              # mutationThreshold in pom.xml gates on mutation score = killed / total
              # (includes NO_COVERAGE mutants in the denominator) — see pom.xml comment
              # at the pitest-maven plugin configuration. Test strength (killed / reached)
              # is reported for visibility only and is NOT what the build gate evaluates.
              mutation_score = round(killed / total * 100, 1) if total else 0.0
              test_strength = round(killed / reached * 100, 1) if reached else 0.0
              threshold = 77.0  # keep in sync with pom.xml <mutationThreshold>

              result.update({
                  "killed": killed,
                  "survived": survived,
                  "no_coverage": no_coverage,
                  "total": total,
                  "mutation_score": mutation_score,
                  "test_strength": test_strength,
                  "threshold": threshold,
                  "gate_pass": mutation_score >= threshold,
                  "top_survived_classes": sorted(
                      survived_by_class.items(), key=lambda kv: kv[1], reverse=True
                  )[:5],
              })

          with open("pit-results.json", "w") as f:
              json.dump(result, f)

          print(json.dumps(result, indent=2))
          PY

      - name: Comment PR with PIT Mutation Results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'backend/pit-results.json';
            if (!fs.existsSync(path)) return;

            const pit = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!pit.present) return;

            const gateStatus = pit.gate_pass ? '✅' : '❌';

            let comment = '## 🧬 Mutation Testing (PIT)\n\n';
            comment += '| Metric | Value | Threshold |\n';
            comment += '|---|---|---|\n';
            comment += `| Mutation Score (gate) | ${pit.mutation_score}% | ≥ ${pit.threshold}% ${gateStatus} |\n`;
            comment += `| Test Strength (informational) | ${pit.test_strength}% | not gated |\n`;
            comment += `| Killed | ${pit.killed} | — |\n`;
            comment += `| Survived | ${pit.survived} | — |\n`;
            comment += `| No Coverage | ${pit.no_coverage} | — |\n`;

            if (pit.top_survived_classes.length > 0) {
              comment += '\n### Top classes by surviving/uncovered mutants\n\n';
              comment += '| Class | Count |\n|---|---|\n';
              for (const [cls, count] of pit.top_survived_classes) {
                comment += `| ${cls} | ${count} |\n`;
              }
            }

            comment += '\n*Mutation Score (killed / all generated mutants, including no-coverage) is the metric `mutationThreshold` in `pom.xml` gates the build on. Test Strength (killed / reached mutants) is shown for visibility but does not gate the build.*\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Run PIT mutation testing (debug)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pit_debug == 'true' }}
        continue-on-error: true
        run: >-
          mkdir -p target/pit-reports &&
          ./mvnw -e -X org.pitest:pitest-maven:mutationCoverage
          -Dpitest.verbose=true
          -Dverbose=true
          -Dpitest.threads=1
          -Dpitest.jvmArgs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=target/pit-reports/pit-heapdump.hprof -XX:ErrorFile=target/pit-reports/hs_err_pid%p.log"
          -Djacoco.argLine=
          -Dpitest.skip=false
          -Dpitest.failWhenNoMutations=false
          -Dspring.profiles.active=test

      - name: Upload PIT reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.pit_debug == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: |
            backend/target/pit-reports/
            backend/target/pit-reports/*.hprof
            backend/target/pit-reports/hs_err_pid*.log
      
      - name: Generate coverage report
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: ./mvnw jacoco:report

      - name: Upload coverage to Codecov
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: integration
          name: integration-coverage

      - name: Upload coverage report
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

      - name: Check coverage threshold
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: |
          COVERAGE=$(grep -oP 'Total.*?\K[0-9]+(?=%)' target/site/jacoco/index.html || echo "0")
          echo "Coverage: ${COVERAGE}%"
          if [ "$COVERAGE" -lt 60 ]; then
            echo "Coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

  # Job 3: Reliability Tests
  reliability-tests:
    name: Reliability Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'
      
      - name: Grant execute permissions to mvnw
        run: chmod +x ./mvnw
      
      - name: Run reliability tests
        run: ./mvnw test -Dtest=ReliabilityTest
      
      - name: Upload reliability test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-test-results
          path: backend/target/surefire-reports/

  # Job 4: E2E Tests (RestAssured API suite, backend/src/test/.../e2e/)
  # NOT the browser-driven Selenium suite (E2ETest.java) that #647 retired -- this is a
  # separate, self-contained @SpringBootTest(webEnvironment=RANDOM_PORT) API-level suite
  # (CartApiTest/OrderApiTest/ProductApiTest, @Tag("e2e")) that needs no Chrome/frontend and
  # was mistakenly deleted-then-restored during #647's own implementation once that scope
  # error was caught.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Grant execute permissions to mvnw
        run: chmod +x ./mvnw

      - name: Run E2E tests
        run: ./mvnw test -P e2e-tests

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: backend/target/surefire-reports/

  # Job 4b: Playwright E2E Tests (#117, #647)
  # Frontend-owned E2E suite. Replaced the JVM-hosted Selenium suite (E2ETest.java) per ADR 0002
  # — #647 removed that suite once this job demonstrated 3/3 real green runs on master.
  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration-tests
    defaults:
      run:
        working-directory: frontend
    # Required: @Cacheable (e.g. ProductServiceImpl#getProductById) does not gracefully degrade
    # when Redis is unreachable, unlike the app's own RateLimiterService circuit-breaker pattern
    # -- RedisConnectionFailureException propagates and gets misreported as a 404 "Product not
    # found". Confirmed locally: product detail returned 404 without Redis, 200 with it. Tracked
    # as its own follow-up (the caching-resilience gap itself is out of #117's scope) -- this
    # service container is the pragmatic fix for this job specifically.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Grant execute permissions to mvnw
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Start backend (H2, real security config)
        working-directory: backend
        # Deliberately does NOT activate Spring's "test" profile: that profile excludes
        # SecurityConfig (@Profile("!test")), which only gets substituted by TestSecurityConfig
        # inside an actual @SpringBootTest context — a CLI-launched `spring-boot:run` under the
        # "test" profile has no such substitution and fails to start (zero AuthenticationManager
        # bean). Overriding datasource/secret properties directly instead keeps the real
        # SecurityConfig active against a disposable H2 database. Mirrors the load-test job's own
        # already-proven pattern below (fixed in #631) rather than a fresh guess — this step's
        # first version omitted `useTestClasspath=true` and failed with "Cannot load driver
        # class: org.h2.Driver" (H2 is a test-scoped dependency in pom.xml, so plain
        # `spring-boot:run` never puts it on the classpath even with the datasource URL
        # overridden). See lesson_spring_boot_run_cli_test_profile_gotchas.md (found via #631)
        # for the full reasoning behind all 3 flags below. Note: useTestClasspath reliably adds
        # test-scope *dependency jars* (like the H2 driver) but does NOT reliably make classes
        # compiled to target/test-classes discoverable by component scan under the `run` goal
        # (a known upstream limitation, spring-projects/spring-boot#36115) -- E2ESeedDataRunner
        # below therefore lives in src/main/java, not src/test/java, despite being test-only.
        run: |
          JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')
          # app.cors.allowed-origins must include the vite-preview port (4173) this job's
          # frontend is served on -- SecurityConfig's real CorsFilter (not TestSecurityConfig's
          # wildcarded one, which is why the Selenium e2e-tests job never hits this) rejects any
          # Origin outside its allowlist with a 403 "Invalid CORS request", discovered only by a
          # real browser request (curl/MockMvc don't send Origin -- same class of gap as #426).
          # spring.cache.type=none: ProductServiceImpl#getProductById's @Cacheable entry is
          # genuinely broken on cache-hit -- confirmed locally (repeatable: 1st call to
          # /api/public/products/{id} succeeds, every call after that fails with
          # SerializationException: Could not read JSON, surfacing as a false 404 "Product not
          # found"). Filed as #651; caching itself isn't what this E2E suite exists to test, so
          # disabling it here is the pragmatic scoped fix rather than blocking on the real bug.
          ARGS="--server.port=8080 --spring.datasource.url=jdbc:h2:mem:e2edb --spring.datasource.username=sa --spring.datasource.password= --spring.datasource.driver-class-name=org.h2.Driver --spring.jpa.hibernate.ddl-auto=create-drop --spring.sql.init.mode=never --spring.liquibase.default-schema=PUBLIC --spring.jpa.properties.hibernate.default_schema=PUBLIC --elasticsearch.enabled=false --spring.cache.type=none --jwt.secret=${JWT_SECRET} --razorpay.key.id=test_key_id --razorpay.key.secret=test_key_secret --razorpay.webhook.secret=test_webhook_secret --app.cors.allowed-origins=http://localhost:4173 --e2e.seed.enabled=true"
          nohup ./mvnw spring-boot:run \
            -Dspring-boot.run.useTestClasspath=true \
            -Dspring-boot.run.arguments="$ARGS" \
            > backend-e2e.log 2>&1 &
          echo "Waiting for backend to become ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null 2>&1 || curl -sf http://localhost:8080/api/public/products > /dev/null 2>&1; then
              echo "Backend is up."
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become ready in time:"
          tail -200 backend-e2e.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start frontend preview server
        run: |
          nohup npm run preview -- --port 4173 --strictPort > frontend-preview.log 2>&1 &
          echo "Waiting for frontend preview server to become ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Frontend preview server is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend preview server did not become ready in time:"
          cat frontend-preview.log
          exit 1

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Upload backend log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-backend-log
          path: backend/backend-e2e.log

  # Job 5: Security Scan
  security-scan:
    name: Security Scan (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'
      
      - name: Grant execute permissions to mvnw
        run: chmod +x ./mvnw
      
      - name: Run OWASP dependency check
        run: ./mvnw dependency-check:check
        continue-on-error: true
      
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html

  # Job 6: Load Tests (Main branch only)
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Grant execute permissions to mvnw
        run: chmod +x ./mvnw

      - name: Start application (in-memory H2, real security config)
        # #631: gatling:test only fires HTTP requests at an already-running server — it never
        # starts one itself. Previously nothing here started the app, so every request failed
        # with connection-refused and the Gatling assertions failed on every run (masked by
        # continue-on-error until #130 removed that). Mirrors the e2e-tests job's own nohup +
        # curl-readiness pattern below for the frontend preview server.
        #
        # Deliberately does NOT activate the `test` Spring profile: SecurityConfig is
        # `@Profile("!test")` (it assumes a manually-`@Import`ed TestSecurityConfig in a real
        # JUnit context), so `-Dspring-boot.run.profiles=test` here would boot with no
        # AuthenticationManager bean at all and fail startup — verified locally. Instead,
        # `useTestClasspath=true` puts the H2 driver (test-scoped dependency) on the run
        # classpath, and the individual properties below are set explicitly via
        # `spring-boot.run.arguments` so the app boots against H2 with the REAL security chain
        # (JWT auth, CORS, rate limiting) and no external MySQL/Redis/ES dependency — closer to
        # production behavior than the test-profile permissive config, which matters for a load
        # test meant to exercise real auth-gated endpoints. `ddl-auto=create-drop` (not the
        # default `validate`) because Hibernate's own generated H2 types don't always match
        # Liquibase's MySQL-targeted changeset types (confirmed locally: `is_default` boolean
        # column mismatch) — create-drop lets Hibernate regenerate the schema from the entity
        # mappings after Liquibase runs, avoiding the mismatch.
        run: |
          ARGS="--spring.datasource.url=jdbc:h2:mem:testdb --spring.datasource.username=sa --spring.datasource.password= --spring.datasource.driver-class-name=org.h2.Driver --spring.jpa.hibernate.ddl-auto=create-drop --spring.sql.init.mode=never --spring.liquibase.default-schema=PUBLIC --spring.jpa.properties.hibernate.default_schema=PUBLIC --jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA== --razorpay.key.id=test_key_id --razorpay.key.secret=test_key_secret --razorpay.webhook.secret=test_webhook_secret"
          nohup ./mvnw spring-boot:run \
            -Dspring-boot.run.useTestClasspath=true \
            -Dspring-boot.run.arguments="$ARGS" \
            > app.log 2>&1 &
          echo "Waiting for application to become ready..."
          # /actuator/health/readiness (not /actuator/health) — overall health aggregates
          # Redis/Elasticsearch/mail indicators, which are deliberately unreachable in this
          # stripped-down environment and would keep the aggregate status DOWN forever even
          # though the app itself is fully serving requests (verified locally).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "Application is up."
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time:"
          cat app.log
          exit 1

      - name: Run Gatling load tests
        # simulationClass pinned in pom.xml's gatling-maven-plugin config (#631) — LoadTestSimulation
        # is the only simulation with real global assertions (response time + success rate).
        run: ./mvnw gatling:test

      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-reports
          path: backend/target/gatling/

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-app-log
          path: backend/app.log

  # Job 7: Stress Tests (Scheduled only)
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'
      
      - name: Grant execute permissions to mvnw
        run: chmod +x ./mvnw
      
      - name: Run stress tests
        run: ./mvnw test -P stress-tests
        continue-on-error: true
      
      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: backend/target/surefire-reports/

  # Job 8: Build Docker Image and Push to Registry (HIGH #7)
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [integration-tests, security-scan]
    # Only build images on main/master branch or tags
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Grant execute permissions to mvnw
        run: chmod +x ./mvnw
      
      - name: Build application JAR
        run: ./mvnw clean package -DskipTests
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: backend/target/*.jar
      
      # Docker build and push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: pradipghadge
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: pradipghadge/buildnest-ecommerce
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=tagname
      
      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
      
      - name: Image summary
        run: echo "✅ Docker image built and pushed successfully" && echo "Tags ${{ steps.meta.outputs.tags }}" && echo "Digest ${{ steps.docker_build.outputs.digest }}"

  # Job 9: Performance Report Summary
  report-summary:
    name: Generate Test Report Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, reliability-tests, e2e-tests, playwright-e2e]
    if: always()
    defaults:
      run:
        working-directory: .

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results/
      
      - name: Generate summary
        run: |
          echo "# Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Reliability Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ E2E Tests (RestAssured API suite): Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Playwright E2E Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "- Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Load Test Reports" >> $GITHUB_STEP_SUMMARY
