name: Security & Quality Scan

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    - cron: '0 0 * * 0'  # Weekly

permissions:
  contents: read
  security-events: write
  checks: write

defaults:
  run:
    working-directory: backend

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan every commit being
          # pushed/diffed, not just the current tree snapshot (#114).
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'civil-ecommerce'
          path: '.'
          format: 'SARIF'
          # #405: npm retired its legacy audit endpoints (registry.npmjs.org
          # /-/npm/v1/security/audits and /quick) in ~April 2026 — they now return
          # HTTP 410 "This endpoint is being retired. Use the bulk advisory endpoint
          # instead." NodeAuditAnalyzer targets the retired endpoint and has no way to
          # reach it; this is an upstream DependencyCheck limitation (tracked e.g.
          # dependency-check/DependencyCheck#8421/#8423 — migration to the bulk API),
          # not something fixable from this repo's CI config. Disable it explicitly
          # rather than let every run fail-then-self-disable at runtime, mirroring how
          # the Sonatype OSS Index analyzer is already disabled non-fatally for the
          # same "unreachable dependency" reason. RetireJS and the NVD CPE analyzer
          # still run and cover frontend/package-lock.json dependencies.
          args: >
            --enableExperimental
            --disableNodeAudit
            --failOnCVSS 7
            --scan .
          out: 'reports'

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'reports/dependency-check-report.sarif'
          wait-for-processing: true
        continue-on-error: true

  security-scan:
    name: Security Vulnerabilities
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Security Scan
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify -DskipTests \
            -Dowasp.dependencycheck.skip=false

      - name: Generate Security Report
        if: always()
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **OWASP DependencyCheck**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- **Maven Security Plugin**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Check artifacts for detailed report" >> $GITHUB_STEP_SUMMARY

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          # Same bug as the Upload Quality Reports step below (uses: steps don't inherit
          # defaults.run.working-directory) — found while fixing that one, same file, same
          # root cause.
          path: |
            backend/target/dependency-check-report.*
            backend/target/security-report.*

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # SonarCloud needs full history (not the default shallow clone) for accurate
          # blame/SCM data and to diff a PR branch against its base for decoration.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Quality Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x mvnw
          # `verify` (not `test`) so the JaCoCo XML report used below is guaranteed
          # generated before the sonar goal reads it. The `sonar:sonar` goal is invoked
          # via its full plugin coordinates below — no pom.xml plugin declaration or
          # Maven profile is required for this to work; Maven resolves it directly from
          # Maven Central. The previous command ran only `clean test -Psonar`, which
          # neither invoked the sonar goal nor exercised a "sonar" profile that has never
          # existed in this pom.xml, so SONAR_TOKEN being valid never mattered — nothing
          # was actually being submitted to SonarCloud.
          # dependency-check-maven's check goal is bound to the default verify phase
          # in this pom.xml with no skip gate, so a plain `mvn verify` here would also
          # trigger a full, slow OWASP/NVD scan — redundant with the dedicated
          # `dependency-check`/`security-scan` jobs already in this same workflow.
          # Explicitly skip it in this job only.
          # `sonar.coverage.exclusions` mirrors pom.xml's jacoco-maven-plugin `report`
          # execution's own <excludes> list exactly (config/**, model/dto, model/payload,
          # *Application, a handful of logging/exception classes). Without this, Sonar's
          # new_coverage gate demanded 80% coverage on packages jacoco:report never even
          # includes data for (they're structurally absent from jacoco.xml, not merely
          # untested) — any PR touching those packages would fail new_coverage regardless
          # of test effort (PR #370/#84 hit this for CacheConfig). Keep both lists in sync.
          #
          # #320: the sonar:sonar goal's own exit code only reflects whether the report was
          # successfully SUBMITTED to SonarCloud's background compute engine -- an
          # "ANALYSIS SUCCESSFUL" log line does not mean the quality gate was evaluated or
          # waited on. `sonar.qualitygate.wait=true` makes the goal poll the compute-engine
          # task and exit non-zero if the "Sonar way" gate (org default -- no new bugs/
          # vulnerabilities, Maintainability rating A, 100% new hotspots reviewed, >=80% new
          # coverage, <=3% duplication; verified on sonarcloud.io/organizations/pradip9096
          # /quality_gates before this change) actually fails. Without this flag, the step
          # can never genuinely gate on Critical/Blocker-equivalent findings, no matter what
          # the `|| echo` wrapper below does.
          #
          # The `|| echo` below is now scoped to a genuine "not configured" case only (empty
          # SONAR_TOKEN, e.g. a fork PR with no secret access) via the `if` guard -- when the
          # token IS present, a scanner error or a failed quality gate now fails this step for
          # real, matching AC 3's "distinguish not-configured from analysis-failed."
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SonarQube analysis skipped — SONAR_TOKEN not available in this run's context (e.g. a fork PR without secret access)."
          else
            ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
              -Ddependency-check.skip=true \
              -Dsonar.projectKey=buildnest-ecommerce \
              -Dsonar.organization=pradip9096 \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=$SONAR_TOKEN \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
              -Dsonar.coverage.exclusions=**/model/dto/**,**/model/payload/**,**/config/**,**/*Application.java,**/exception/ResourceNotFoundException.java,**/exception/AccessDeniedException.java,**/exception/PaymentProcessingException.java,**/exception/ExternalServiceException.java,**/util/EventLogger.java,**/util/TransactionLogger.java,**/util/LoggingStandards.java
          fi

      - name: Run CheckStyle
        # #320: the Sonar step above can now genuinely fail (quality-gate failure or a real
        # scanner error) instead of always exiting 0 via `|| echo`. Without `if: always()`
        # here, GitHub Actions would silently skip this and every later step in the job on a
        # Sonar failure -- the same step-skip gotcha #354 already fixed for the CheckStyle ->
        # SpotBugs boundary, recurring one step earlier now that Sonar precedes CheckStyle.
        if: always()
        run: |
          # Baseline + ratchet (#354), matching the PIT mutation-score pattern already used in
          # this repo (pom.xml's mutationThreshold, 77%->83% through M5). 8305 is the real,
          # verified violation count as of #354 -- the ceiling below, not a target. This step
          # now genuinely blocks the build, but only if the count grows ABOVE this baseline
          # (maxAllowedViolations fails only when violations > the given number, so a PR that
          # introduces zero new violations still passes even though 8305 remain). This does not
          # require fixing the existing 8305 now; it stops the count from growing silently,
          # which unconditional non-blocking never did. Lower this number as violations are
          # triaged and fixed -- raising it back up requires a documented reason, mirroring the
          # one-way-tightening rule already applied to this repo's other quality ratchets.
          ./mvnw -B checkstyle:check -Dcheckstyle.maxAllowedViolations=8305

      - name: Run SpotBugs
        if: always()
        run: |
          # Blocking on High-priority findings only (#317), following the same triage-then-block
          # sequencing already used for CheckStyle (#354): #353 first got this goal resolving at
          # all, then this run's initial 103 findings were triaged (4 Priority-1/High, all real
          # defects, all fixed in the same change that added this threshold; 97 Priority-2/Medium
          # left as tracked, non-blocking debt -- see #316's other sub-issues). pom.xml's
          # <threshold>High</threshold> makes `spotbugs:check` itself fail only on High findings,
          # so no `|| echo` fallback is needed here -- a real failure now genuinely fails this step.
          ./mvnw -B spotbugs:check

      - name: Run PMD
        if: always()
        run: |
          # #318 (relocated here after its original home, ci-cd.yml, was found to have zero run
          # history — that workflow's trigger is `branches: [main, develop]`, and this repo's
          # real branch is `master`, so the gate had never once executed since #318 was closed).
          # Same baseline+ratchet pattern as CheckStyle (#354) and SpotBugs (#317): blocking only
          # on a net-new violation beyond the freshly-reverified baseline of 48 (10 priority-3,
          # 38 priority-4 -- verified via `./mvnw pmd:check` locally). No maven-pmd-plugin
          # declaration is needed in pom.xml -- same as checkstyle-maven-plugin, `pmd` resolves
          # via Maven's default plugin-prefix group.
          ./mvnw -B pmd:check -Dpmd.maxAllowedViolations=48

      - name: Generate Quality Report
        if: always()
        run: |
          echo "## 📈 Code Quality Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/checkstyle-result.xml ]; then
            # grep -o ... | wc -l, not grep -c, per #353's lesson: don't assume the report is
            # line-oriented (this one currently is, but a format change shouldn't silently break
            # the count the way -c would).
            violation_count=$(grep -o "<error " target/checkstyle-result.xml | wc -l)
            echo "- **CheckStyle**: ✅ Enabled — ${violation_count}/8305 finding(s) (blocking only above the baseline — see #354)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **CheckStyle**: ⚠️ Enabled but no report was generated — check the Run CheckStyle step's log" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f target/spotbugsXml.xml ]; then
            # spotbugsXml.xml is emitted as a single unbroken line — `grep -c` counts matching
            # *lines*, not occurrences, and would always report 0 or 1 regardless of the real
            # count. `grep -o ... | wc -l` counts every occurrence correctly.
            bug_count=$(grep -o "<BugInstance" target/spotbugsXml.xml | wc -l)
            echo "- **SpotBugs**: ✅ Enabled — ${bug_count} finding(s) (blocking on Priority-1/High only — see #317)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **SpotBugs**: ⚠️ Enabled but no report was generated — check the Run SpotBugs step's log" >> $GITHUB_STEP_SUMMARY
          fi
          # #320: gate pass/fail is now enforced by the Run Quality Analysis step's own exit
          # code (sonar.qualitygate.wait=true), so a failure already shows up as that step's
          # red X above -- re-deriving pass/fail here would mean a second call to SonarCloud's
          # compute-engine task API for a signal the job status already carries for free.
          # report-task.txt's presence just confirms analysis genuinely ran (vs. skipped for a
          # missing token).
          if [ -f target/pmd.xml ]; then
            violation_count=$(grep -o "<violation " target/pmd.xml | wc -l)
            echo "- **PMD**: ✅ Enabled — ${violation_count}/48 finding(s) (blocking only above the baseline — see #318)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **PMD**: ⚠️ Enabled but no report was generated — check the Run PMD step's log" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f target/sonar/report-task.txt ]; then
            echo "- **SonarQube**: ✅ Analysis ran — quality gate result reflected in the Run Quality Analysis step above; see the SonarCloud dashboard for details" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **SonarQube**: ⚠️ Skipped — SONAR_TOKEN was not available in this run's context" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          # actions/upload-artifact is a `uses:` step, so it does NOT inherit this job's
          # defaults.run.working-directory: backend (that only applies to `run:` steps) — a
          # bare `target/...` path resolves relative to GITHUB_WORKSPACE (the repo root), not
          # backend/. Confirmed on #355's own CI run: none of these three files were ever
          # actually uploaded ("No files were found... No artifacts will be uploaded"), for
          # every path in this list, since before #353 touched this step. Same bug class as
          # lesson_github_actions_working_directory_default_scope (found fixing #329).
          path: |
            backend/target/spotbugsXml.xml
            backend/target/checkstyle-result.xml
            backend/target/sonar/report-task.txt
        continue-on-error: true
