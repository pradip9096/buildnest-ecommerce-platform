name: Quality Gate Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

env:
  JAVA_VERSION: "21"

jobs:
  # #412: detects whether a PR/push touches only paths-ignore'd content
  # (docs/**, **/*.md, .github/ISSUE_TEMPLATE/**). Downstream jobs stay always-
  # triggering (no workflow-level paths-ignore) so their required-check names
  # always report a status; individual expensive steps are gated on this
  # output instead. See development-workflow.md's CI Failure Handling /
  # Workflow File Responsibilities for why (required checks never satisfy
  # branch protection if the whole workflow is skipped by paths-ignore).
  detect-changes:
    name: Detect Doc-Only Change
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # predicate-quantifier: every is required here -- the default ("some")
          # OR's every pattern in the rule together, so the bare '**' alone would
          # already match everything regardless of the negations below (confirmed
          # empirically: code-changed was 'true' for a docs-only PR without this).
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: detect-changes
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"

      - name: Validate Maven Wrapper
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: chmod +x mvnw

      - name: Build with Maven
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: ./mvnw -B clean package -DskipTests

      - name: Run Tests with JaCoCo Coverage
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: ./mvnw -B clean test jacoco:report
        continue-on-error: false

      - name: Generate Coverage Report
        id: coverage
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          from pathlib import Path

          report_file = Path("target/site/jacoco/jacoco.xml")
          if not report_file.exists():
              print("ERROR: JaCoCo report not found!")
              exit(1)

          tree = ET.parse(report_file)
          root = tree.getroot()

          counters = {}
          for counter in root.findall(".//counter"):
              counter_type = counter.get("type")
              missed = int(counter.get("missed", 0))
              covered = int(counter.get("covered", 0))
              total = missed + covered
              percentage = (covered / total * 100) if total > 0 else 0
              counters[counter_type] = {
                  "missed": missed,
                  "covered": covered,
                  "total": total,
                  "percentage": round(percentage, 2)
              }

          thresholds = {
              "INSTRUCTION": 85.0,
              "LINE": 85.0,
              "BRANCH": 85.0,
              "METHOD": 85.0,
              "CLASS": 85.0
          }

          report = "## 📊 Code Coverage Report\n\n"
          report += "| Metric | Coverage | Threshold | Status |\n"
          report += "|--------|----------|-----------|--------|\n"

          all_pass = True
          for metric, threshold in thresholds.items():
              if metric in counters:
                  cov = counters[metric]
                  status = "✅" if cov["percentage"] >= threshold else "❌"
                  if cov["percentage"] < threshold:
                      all_pass = False
                  report += f"| {metric} | {cov['percentage']}% | {threshold}% | {status} |\n"

          report += "\n### Detailed Metrics\n\n"
          for metric in ["INSTRUCTION", "LINE", "BRANCH", "METHOD", "CLASS"]:
              if metric in counters:
                  cov = counters[metric]
                  report += f"**{metric}**: {cov['covered']}/{cov['total']} = {cov['percentage']}%\n"

          with open("coverage-results.json", "w") as f:
              json.dump(counters, f)

          print(report)
          if not all_pass:
              print("\n⚠️  Some coverage thresholds not met!")
          PY

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request' && needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('backend/coverage-results.json', 'utf8'));

            let comment = '## 📊 Coverage Analysis\n\n';
            comment += '| Metric | Coverage | Threshold | Status |\n';
            comment += '|--------|----------|-----------|--------|\n';

            const thresholds = {
              'INSTRUCTION': 85.0,
              'LINE': 85.0,
              'BRANCH': 85.0,
              'METHOD': 85.0,
              'CLASS': 85.0
            };

            for (const [metric, threshold] of Object.entries(thresholds)) {
              if (coverage[metric]) {
                const pct = coverage[metric].percentage;
                const status = pct >= threshold ? '✅' : '❌';
                comment += `| ${metric} | ${pct}% | ${threshold}% | ${status} |\n`;
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Publish Test Results
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: backend/target/surefire-reports/**/*.xml
          check_name: Test Results

      - name: Upload Coverage Reports
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/target/site/jacoco/
            backend/coverage-results.json
          retention-days: 30

      - name: Upload Test Reports
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          retention-days: 30

      - name: Upload Jacoco XML
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: backend/target/site/jacoco/jacoco.xml

      - name: Publish Coverage to Codecov
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Test Summary
        if: always()
        run: |
          if [ "${{ needs.detect-changes.outputs.code-changed }}" == "true" ]; then
            echo "## ✅ Build & Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Tests Run**: Check artifacts for details" >> $GITHUB_STEP_SUMMARY
            echo "- **Coverage Report**: Uploaded to artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⏭️ Build & Test Skipped (docs-only change, #412)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create Failure Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `❌ CI Pipeline Failed: ${context.workflow} #${context.runNumber}`;
            const body = `
            ## Build Failure Details

            **Workflow**: ${context.workflow}
            **Run**: [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Commit**: ${context.sha}
            **Branch**: ${context.ref}

            Please review the logs for details.
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

  # #649: frontend unit/lint checks had zero CI enforcement (npm run test / npm run lint
  # were never invoked anywhere in CI — only npm ci/build/preview inside the E2E jobs to
  # produce a servable build). Deliberately NOT added to branch protection's
  # required_status_checks yet (this repo currently has 6 required contexts, none
  # frontend-related) — starts non-blocking so the job can prove itself green across a
  # few real runs before being promoted to required, avoiding blocking merges on a
  # brand-new job's first runs. Gated at step level (never job-level) per #412/#414's
  # required-check-in-paths-ignore lesson, so this job's own status always reports even
  # on a docs-only change, in case it's promoted to required later.
  frontend-quality:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.detect-changes.outputs.code-changed == 'true'
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        if: needs.detect-changes.outputs.code-changed == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest with coverage
        if: needs.detect-changes.outputs.code-changed == 'true'
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: codecov/codecov-action@v3
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: codecov-frontend
          fail_ci_if_error: false
          verbose: true

      - name: Upload frontend coverage artifact
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [ build, detect-changes ]
    if: always()

    steps:
      - name: Download Coverage Results
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: Skip Notice (docs-only change, #412)
        if: needs.detect-changes.outputs.code-changed != 'true'
        run: echo "Docs-only change — quality gates skipped, reporting success."

      - name: Validate Coverage Thresholds
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: |
          python - <<'PY'
          import json

          coverage = json.load(open('coverage-results.json'))

          thresholds = {
              'INSTRUCTION': 85.0,
              'LINE': 85.0,
              'METHOD': 85.0
          }

          print("🎯 Quality Gate Check")
          print("=" * 50)

          all_pass = True
          for metric, threshold in thresholds.items():
              if metric in coverage:
                  actual = coverage[metric]['percentage']
                  status = "✅ PASS" if actual >= threshold else "❌ FAIL"
                  print(f"{metric}: {actual}% (target: {threshold}%) - {status}")
                  if actual < threshold:
                      all_pass = False

          print("=" * 50)
          if all_pass:
              print("✅ All quality gates passed!")
          else:
              print("⚠️  Some quality gates failed!")

          exit(0 if all_pass else 1)
          PY

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: [ build, detect-changes ]
    # Not a required check (see branch protection config) — safe to skip the whole
    # job on a docs-only change rather than gating individual steps, preserving
    # #336's CI-minutes savings for this expensive scan.
    if: needs.detect-changes.outputs.code-changed == 'true'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          # Keyed on date, not pom.xml (#342): the NVD CVE dataset is external and
          # updates daily regardless of this project's own dependencies. A pom.xml-hash
          # key means every dependency bump forces a multi-hour full re-sync from
          # scratch instead of a fast incremental delta against a warm cache. Do not
          # reintroduce a hashFiles('**/pom.xml') key here.
          path: ~/.dependency-check/data
          key: nvd-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            nvd-db-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        run: ./mvnw verify -Powasp -DskipTests -B
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [build, quality-gates, dependency-check, frontend-quality]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## 🔄 CI/CD Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Quality Gates**: ${{ needs.quality-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Lint & Test**: ${{ needs.frontend-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**OWASP Dependency-Check**: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts Available**:" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "- JaCoCo XML" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency-Check Report" >> $GITHUB_STEP_SUMMARY
