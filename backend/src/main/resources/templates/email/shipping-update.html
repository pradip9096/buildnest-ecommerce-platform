<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Shipping Update</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 24px;">
    <h1 style="color: #2c7a4b;">Your Order Has Shipped!</h1>
    <p>Hi <span th:text="${customerName}">Customer</span>,</p>
    <p>Great news — your BuildNest order is on its way.</p>

    <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
        <tr>
            <td style="padding: 8px; font-weight: bold;">Order Number</td>
            <td style="padding: 8px;" th:text="${orderNumber}">ORD-001</td>
        </tr>
        <tr style="background: #f5f5f5;">
            <td style="padding: 8px; font-weight: bold;">Tracking Number</td>
            <td style="padding: 8px;" th:text="${trackingNumber}">TRK-000000</td>
        </tr>
        <tr>
            <td style="padding: 8px; font-weight: bold;">Estimated Delivery</td>
            <td style="padding: 8px;" th:text="${estimatedDelivery}">—</td>
        </tr>
    </table>

    <p>Use the tracking number above on the carrier's website to follow your package.</p>
    <p style="color: #999; font-size: 12px;">BuildNest — Your Home Construction &amp; Décor Partner</p>
</div>
</body>
</html>
