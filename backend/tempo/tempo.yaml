# Minimal single-binary Tempo config for local/dev use (#108, OBS-02).
# Local disk storage — fine for dev/staging trace retention; a production deployment would
# swap `backend: local` for an object-store backend (s3/gcs/azure), out of scope for this issue.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 168h  # 7 days
