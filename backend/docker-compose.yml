services:

  # ===============================
  # Elasticsearch
  # ===============================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    container_name: es-single-node
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - buildnest-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://elastic:${ELASTIC_PASSWORD}@localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # Kibana
  # ===============================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.6
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      xpack.security.enabled: "true"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - buildnest-network

  # ===============================
  # Logstash
  # ===============================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.6
    container_name: logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
    ports:
      - "5000:5000"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - buildnest-network

  # ===============================
  # MySQL (Internal Only)
  # ===============================
  mysql:
    image: mysql:8.2
    container_name: buildnest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - buildnest-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # Redis
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: buildnest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - buildnest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # Mailpit — local SMTP catcher for dev/test email verification (#327)
  # No real SMTP credentials needed locally: set MAIL_HOST=mailpit, MAIL_PORT=1025
  # in backend/.env, then view sent emails at http://localhost:8025
  # ===============================
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: buildnest-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - buildnest-network

  # ===============================
  # Prometheus
  # ===============================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - buildnest-ecommerce
    networks:
      - buildnest-network

  # ===============================
  # Spring Boot Application
  # ===============================
  buildnest-ecommerce:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildnest-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ELASTICSEARCH_SSL_ENABLED: ${ELASTICSEARCH_SSL_ENABLED}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - buildnest-network

# ===============================
# Volumes
# ===============================
volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:

# ===============================
# Network
# ===============================
networks:
  buildnest-network:
    driver: bridge
