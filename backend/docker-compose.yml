services:

  # ===============================
  # Elasticsearch
  # ===============================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    container_name: es-single-node
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - buildnest-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://elastic:${ELASTIC_PASSWORD}@localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # Kibana
  # ===============================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.6
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      xpack.security.enabled: "true"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - buildnest-network

  # ===============================
  # Elasticsearch ILM setup (#326): one-shot sidecar that registers the app-logs-retention-policy
  # ILM policy (delete-only, 30-day min_age -- no rollover action, since Logstash already creates
  # one new app-logs-YYYY.MM.dd index per day) and an index template matching app-logs-* that
  # applies the policy via index.lifecycle.name. Must complete before logstash starts writing,
  # since ILM only governs indices created after the matching template exists -- it does not
  # retroactively apply to already-existing indices. Mirrors prometheus-config-render (#324) /
  # alertmanager-config-render (#122): list + literal-block command form (not `command: >` folded
  # scalar), since that form previously mis-tokenized a similar multi-statement script (#122/#363).
  # ===============================
  elasticsearch-ilm-setup:
    image: alpine:3.20
    container_name: elasticsearch-ilm-setup
    environment:
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
    volumes:
      - ./elasticsearch-ilm-policy.json:/config/ilm-policy.json:ro
      - ./elasticsearch-ilm-index-template.json:/config/index-template.json:ro
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        curl -sf -u "$$ELASTICSEARCH_USERNAME:$$ELASTICSEARCH_PASSWORD" \
          -X PUT http://elasticsearch:9200/_ilm/policy/app-logs-retention-policy \
          -H 'Content-Type: application/json' \
          -d @/config/ilm-policy.json
        curl -sf -u "$$ELASTICSEARCH_USERNAME:$$ELASTICSEARCH_PASSWORD" \
          -X PUT http://elasticsearch:9200/_index_template/app-logs-template \
          -H 'Content-Type: application/json' \
          -d @/config/index-template.json
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - buildnest-network
    restart: "no"

  # ===============================
  # Logstash
  # ===============================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.6
    container_name: logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
    ports:
      - "5000:5000"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-ilm-setup:
        condition: service_completed_successfully
    networks:
      - buildnest-network

  # ===============================
  # MySQL (Internal Only)
  # ===============================
  mysql:
    image: mysql:8.2
    container_name: buildnest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - buildnest-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # Redis
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: buildnest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - buildnest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # mysqld_exporter config renderer (#122): mysqld_exporter v0.15+ removed DATA_SOURCE_NAME
  # env var support entirely (confirmed by live testing -- it silently fails to start with
  # "no user specified in section or parent" / "Error parsing host config: no configuration
  # found" when only DATA_SOURCE_NAME is set) in favor of a mounted --config.my-cnf file.
  # Renders my.cnf.template with the real password, mirroring prometheus-config-render (#324).
  # ===============================
  mysqld-exporter-config-render:
    image: alpine:3.20
    container_name: mysqld-exporter-config-render
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysqld-exporter/my.cnf.template:/template/my.cnf.template:ro
      - mysqld_exporter_config:/config
    command: >
      sh -c "sed \"s|__MYSQL_ROOT_PASSWORD__|$$MYSQL_ROOT_PASSWORD|g\" /template/my.cnf.template > /config/my.cnf"
    restart: "no"

  # ===============================
  # mysqld_exporter — feeds the MySQL Grafana dashboard (#122). Re-added after #325 removed
  # this scrape target: that removal was correct at the time (no exporter was deployed, so the
  # target was permanently "down" noise), but #122 is exactly the "real metrics tier" #325 said
  # to wait for.
  # ===============================
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: buildnest-mysqld-exporter
    command:
      - "--config.my-cnf=/etc/mysqld_exporter/my.cnf"
    volumes:
      - mysqld_exporter_config:/etc/mysqld_exporter:ro
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
      mysqld-exporter-config-render:
        condition: service_completed_successfully
    networks:
      - buildnest-network

  # ===============================
  # redis_exporter — feeds the Redis Grafana dashboard (#122). Same re-add rationale as
  # mysqld-exporter above.
  # ===============================
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: buildnest-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - buildnest-network

  # ===============================
  # node_exporter — host-level metrics (disk usage) for the HighDiskUsage alert rule
  # (alerts.yml), which was previously dangling with no exporter feeding it. Read-only bind
  # mount of the host's root filesystem. Deliberately plain ":ro", not ":ro,rslave" -- rslave
  # mount propagation requires the host's "/" to already be a shared mount, which isn't
  # guaranteed under Docker Desktop's WSL2 backend and fails outright there ("path / is
  # mounted on / but it is not a shared mount"); node_exporter doesn't need to observe new
  # mounts created on the host after container start, so plain read-only access is sufficient.
  # ===============================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: buildnest-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro"
    ports:
      - "9100:9100"
    networks:
      - buildnest-network

  # ===============================
  # Mailpit — local SMTP catcher for dev/test email verification (#327)
  # No real SMTP credentials needed locally: set MAIL_HOST=mailpit, MAIL_PORT=1025
  # in backend/.env, then view sent emails at http://localhost:8025
  # ===============================
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: buildnest-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - buildnest-network

  # ===============================
  # Prometheus config renderer (#324): substitutes __ENVIRONMENT__ in
  # prometheus.yml.template with the real ENVIRONMENT value before Prometheus starts, since
  # the pinned v2.52.0 image predates native external_labels env-var substitution
  # (--enable-feature=expand-external-labels, v2.55+). One-shot: renders into the shared
  # prometheus_config volume, then exits; the prometheus service waits for it to complete.
  # ===============================
  prometheus-config-render:
    image: alpine:3.20
    container_name: prometheus-config-render
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      # #359: monitoring credential Prometheus uses to authenticate its own scrape of
      # /actuator/prometheus (SecurityConfig#actuatorMonitoringSecurityFilterChain).
      MONITORING_USERNAME: ${MONITORING_USERNAME:-monitoring}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-changeme-monitoring-password}
    volumes:
      - ./prometheus.yml.template:/template/prometheus.yml.template:ro
      - ./alerts.yml:/template/alerts.yml:ro
      - prometheus_config:/config
    command: >
      sh -c "sed -e \"s/__ENVIRONMENT__/$$ENVIRONMENT/g\" -e \"s/__MONITORING_USERNAME__/$$MONITORING_USERNAME/g\" -e \"s/__MONITORING_PASSWORD__/$$MONITORING_PASSWORD/g\" /template/prometheus.yml.template > /config/prometheus.yml &&
             cp /template/alerts.yml /config/alerts.yml"
    restart: "no"

  # ===============================
  # Prometheus
  # ===============================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      # Previously bind-mounted prometheus.yml alone -- alerts.yml (referenced by this
      # config's own rule_files: - 'alerts.yml') was never mounted at all, so that reference
      # was dangling at runtime. Both files now come from the rendered volume above (#324).
      - prometheus_config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      prometheus-config-render:
        condition: service_completed_successfully
      buildnest-ecommerce:
        condition: service_started
      mysqld-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
    networks:
      - buildnest-network

  # ===============================
  # Alertmanager config renderer (#122): substitutes __PLACEHOLDER__ tokens in
  # alertmanager.yml.template with real env values and strips whichever notification-channel
  # block (Slack / email) is disabled. Mirrors prometheus-config-render (#324).
  # ===============================
  alertmanager-config-render:
    image: alpine:3.20
    container_name: alertmanager-config-render
    environment:
      SLACK_ENABLED: ${ALERTMANAGER_SLACK_ENABLED:-false}
      SLACK_WEBHOOK_URL: ${ALERTMANAGER_SLACK_WEBHOOK_URL:-}
      SLACK_CHANNEL: ${ALERTMANAGER_SLACK_CHANNEL:-#alerts}
      EMAIL_ENABLED: ${ALERTMANAGER_EMAIL_ENABLED:-false}
      ALERT_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${MAIL_FROM:-alerts@buildnest.local}
      SMTP_HOST: ${MAIL_HOST:-mailpit}
      SMTP_PORT: ${MAIL_PORT:-1025}
      SMTP_USERNAME: ${MAIL_USERNAME:-}
      SMTP_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - ./alertmanager.yml.template:/template/alertmanager.yml.template:ro
      - alertmanager_config:/config
    # A single YAML list item containing a literal block script (rather than the `command: >`
    # folded-scalar + `sh -c "..."` string form used by prometheus-config-render above) --
    # that form silently mis-tokenized this longer, multi-`-e`-flag script: YAML's folding
    # rules preserve newlines on more-indented continuation lines, and combined with the
    # escaped inner quotes it broke shlex parsing into separate top-level arguments (observed
    # as `sh: -e: not found` x8 and a `Permission denied` trying to exec the template file
    # directly). The list + literal-block form passes the whole script as one unambiguous
    # argv element, avoiding the shlex step entirely.
    command:
      - sh
      - -c
      - |
        sed \
          -e "s|__SLACK_WEBHOOK_URL__|$$SLACK_WEBHOOK_URL|g" \
          -e "s|__SLACK_CHANNEL__|$$SLACK_CHANNEL|g" \
          -e "s|__ALERT_EMAIL_TO__|$$ALERT_EMAIL_TO|g" \
          -e "s|__ALERT_EMAIL_FROM__|$$ALERT_EMAIL_FROM|g" \
          -e "s|__SMTP_HOST__|$$SMTP_HOST|g" \
          -e "s|__SMTP_PORT__|$$SMTP_PORT|g" \
          -e "s|__SMTP_USERNAME__|$$SMTP_USERNAME|g" \
          -e "s|__SMTP_PASSWORD__|$$SMTP_PASSWORD|g" \
          /template/alertmanager.yml.template > /tmp/rendered.yml
        if [ "$$SLACK_ENABLED" != "true" ]; then sed -i "/# BEGIN_SLACK/,/# END_SLACK/d" /tmp/rendered.yml; fi
        if [ "$$EMAIL_ENABLED" != "true" ]; then sed -i "/# BEGIN_EMAIL/,/# END_EMAIL/d" /tmp/rendered.yml; fi
        cp /tmp/rendered.yml /config/alertmanager.yml
    restart: "no"

  # ===============================
  # Alertmanager — receives firing alerts from Prometheus (prometheus.yml.template's
  # `alerting.alertmanagers` block already pointed at alertmanager:9093; that reference was
  # dangling with no such service deployed until now) and routes them to the notification
  # channel(s) enabled via ALERTMANAGER_SLACK_ENABLED / ALERTMANAGER_EMAIL_ENABLED (#122).
  # ===============================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_config:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    depends_on:
      alertmanager-config-render:
        condition: service_completed_successfully
    networks:
      - buildnest-network

  # ===============================
  # Grafana — dashboards for application, JVM, MySQL, and Redis metrics (#122). Datasource and
  # dashboards are auto-provisioned (grafana/provisioning/) so the stack is usable immediately
  # after `docker compose up`, per the AC's "dashboards provisioned automatically" requirement.
  # ===============================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../docs/monitoring/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - buildnest-network

  # ===============================
  # Tempo — distributed trace storage (#108, OBS-02). Receives spans over OTLP from the app
  # (micrometer-tracing-bridge-otel) and is queried by Grafana's Tempo datasource for
  # trace visualization / trace-to-metrics correlation with the existing Prometheus stack.
  # ===============================
  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    # Runs as the image's own non-root default user (10001:10001) — no `user: root` override.
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # Host-published for local dev/debugging convenience only — Tempo has no built-in auth in
    # single-binary mode, same accepted trust model this stack already applies to Prometheus
    # (9090, unauthenticated) and Alertmanager (9093, unauthenticated) below. The app and
    # Grafana themselves reach Tempo over the internal buildnest-network, not through these
    # host ports. Do not publish these ports on any host reachable from an untrusted network —
    # a production deployment needs a reverse proxy/auth layer in front, same as the rest of
    # this observability stack would.
    ports:
      - "3200:3200"   # Tempo query API (used by Grafana datasource)
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - buildnest-network

  # ===============================
  # Spring Boot Application
  # ===============================
  buildnest-ecommerce:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildnest-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ELASTICSEARCH_SSL_ENABLED: ${ELASTICSEARCH_SSL_ENABLED}

      TEMPO_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - buildnest-network

# ===============================
# Volumes
# ===============================
volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  prometheus_config:
  alertmanager_data:
  alertmanager_config:
  grafana_data:
  mysqld_exporter_config:
  tempo_data:

# ===============================
# Network
# ===============================
networks:
  buildnest-network:
    driver: bridge
